<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TAP THE COW</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">TAP THE COW</h1>

  <button id="cow" class="cow" aria-label="Tap the cow to moo">
    <svg viewBox="0 0 440 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <ellipse class="shadow" cx="240" cy="288" rx="162" ry="13"/>

      <!-- tail -->
      <path class="tail" d="M352 96 C390 104 398 158 381 196"/>
      <ellipse class="tuft" cx="381" cy="206" rx="11" ry="15"/>

      <!-- legs: all four sit behind the body so nothing crosses the belly -->
      <g class="far">
        <rect class="leg" x="202" y="146" width="25" height="132" rx="12"/>
        <rect class="leg" x="322" y="146" width="25" height="132" rx="12"/>
        <rect class="hoof" x="202" y="258" width="25" height="20" rx="8"/>
        <rect class="hoof" x="322" y="258" width="25" height="20" rx="8"/>
      </g>
      <rect class="leg" x="168" y="150" width="27" height="132" rx="13"/>
      <rect class="leg" x="290" y="150" width="27" height="132" rx="13"/>
      <rect class="hoof" x="168" y="262" width="27" height="20" rx="8"/>
      <rect class="hoof" x="290" y="262" width="27" height="20" rx="8"/>

      <!-- neck, then the body drawn over its shoulder end -->
      <path class="hide" d="M120 68 C150 62 180 68 200 86 L196 150 C160 156 128 146 116 124 Z"/>
      <ellipse class="hide" cx="250" cy="132" rx="105" ry="58"/>

      <!-- spots -->
      <ellipse class="spot" cx="225" cy="105" rx="33" ry="25" transform="rotate(-15 225 105)"/>
      <ellipse class="spot" cx="308" cy="150" rx="26" ry="20" transform="rotate(20 308 150)"/>
      <ellipse class="spot" cx="278" cy="88" rx="18" ry="12"/>

      <!-- udder -->
      <ellipse class="udder" cx="282" cy="178" rx="30" ry="20"/>
      <circle class="teat" cx="268" cy="195" r="5"/>
      <circle class="teat" cx="296" cy="195" r="5"/>

      <!-- horn and ear tuck behind the head -->
      <path class="horn" d="M88 58 C74 34 92 18 110 30 C96 38 90 46 88 58 Z"/>
      <ellipse class="ear" cx="144" cy="54" rx="26" ry="13" transform="rotate(-42 144 54)"/>

      <!-- head -->
      <ellipse class="hide" cx="96" cy="92" rx="48" ry="40" transform="rotate(-20 96 92)"/>
      <ellipse class="spot" cx="112" cy="68" rx="19" ry="14" transform="rotate(-20 112 68)"/>

      <!-- muzzle -->
      <ellipse class="snout" cx="52" cy="112" rx="30" ry="23" transform="rotate(-15 52 112)"/>
      <ellipse class="nostril" cx="40" cy="104" rx="6" ry="8" transform="rotate(-15 40 104)"/>
      <path class="mouth" id="mouth" d="M26 120 Q42 128 58 123"/>

      <!-- eye -->
      <ellipse class="eye-white" cx="92" cy="76" rx="14" ry="15"/>
      <circle class="pupil" cx="90" cy="78" r="7"/>
      <circle class="glint" cx="93" cy="73" r="3"/>
    </svg>
  </button>

  <p class="hint" id="hint">tap it 👆</p>
  <p class="moo" id="moo" aria-live="polite"></p>

  <script src="moo.js"></script>
</body>
</html>
